name = "xflexacademy-api"
main = "dist/worker.js"
compatibility_date = "2025-02-09"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[env.production]
name = "xflexacademy-api-production"

[env.production.vars]
ENVIRONMENT = "production"
VITE_APP_TITLE = "XFlex Trading Academy"
VITE_APP_LOGO = "https://xflexacademy.com/logo.png"
R2_PUBLIC_URL = "https://videos.xflexacademy.com"
EMAIL_PROVIDER = "auto"
EMAIL_FROM = "support@xflexacademy.com"
EMAIL_FROM_NAME = "XFlex Academy"
SITE_URL = "https://xflexacademy.com"
BUSINESS_POSTAL_ADDRESS = "XFlex Trading Academy, Ramallah, Palestine | support@xflexacademy.com"
PACKAGE_LIVE_DEPLOYMENT_ENABLED = "true"
STAFF_NOTIFICATION_ARCHIVE_ENABLED = "false"
STAFF_NOTIFICATION_ARCHIVE_DRY_RUN = "true"
STAFF_NOTIFICATION_ARCHIVE_RETENTION_DAYS = "30"
STAFF_NOTIFICATION_ARCHIVE_BATCH_LIMIT = "50"
RAW_DATA_RETENTION_ENABLED = "false"
RAW_DATA_RETENTION_DRY_RUN = "true"
RAW_DATA_RETENTION_DAYS = "90"
RAW_DATA_RETENTION_BATCH_LIMIT = "50"

# D1 Database binding (production)
[[env.production.d1_databases]]
binding = "DB"
database_name = "xflexwithai-db"
database_id = "cf374361-2caa-4597-a38d-5cecced7827d"

# R2 Storage binding (production)
[[env.production.r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "xflexwithai-videos"

# Finance receipts remain private and separate from the public video domain.
# Provision this bucket before deploying this configuration.
[[env.production.r2_buckets]]
binding = "FINANCE_RECEIPTS_BUCKET"
bucket_name = "xflexacademy-finance-receipts"

[env.production.triggers]
# Daily lifecycle/reminder jobs run at 08:00 Asia/Amman (05:00 UTC).
# Timed-service repair has a separate invocation/CPU budget so future pending
# work cannot prevent minute recommendation and human-support delivery.
crons = ["* * * * *", "*/5 * * * *", "0 5 * * *"]

[env.staging]
name = "xflexacademy-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
VITE_APP_TITLE = "XFlex Trading Academy (Staging)"
EMAIL_PROVIDER = "auto"
EMAIL_FROM = "support@xflexacademy.com"
EMAIL_FROM_NAME = "XFlex Academy"
SITE_URL = "https://xflexacademy.com"
BUSINESS_POSTAL_ADDRESS = "XFlex Trading Academy, Ramallah, Palestine | support@xflexacademy.com"
STAFF_NOTIFICATION_ARCHIVE_ENABLED = "false"
STAFF_NOTIFICATION_ARCHIVE_DRY_RUN = "true"
STAFF_NOTIFICATION_ARCHIVE_RETENTION_DAYS = "30"
STAFF_NOTIFICATION_ARCHIVE_BATCH_LIMIT = "50"
RAW_DATA_RETENTION_ENABLED = "false"
RAW_DATA_RETENTION_DRY_RUN = "true"
RAW_DATA_RETENTION_DAYS = "90"
RAW_DATA_RETENTION_BATCH_LIMIT = "50"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "xflexwithai-db"
database_id = "cf374361-2caa-4597-a38d-5cecced7827d"

[[env.staging.r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "xflexwithai-videos"

# Enable only after an approved staging bucket is provisioned:
# [[env.staging.r2_buckets]]
# binding = "FINANCE_RECEIPTS_BUCKET"
# bucket_name = "xflexacademy-finance-receipts-staging"

[env.development]
name = "xflexacademy-api-dev"

[env.development.vars]
ENVIRONMENT = "development"
VITE_APP_TITLE = "XFlex Trading Academy (Dev)"
SITE_URL = "http://localhost:5173"
BUSINESS_POSTAL_ADDRESS = "XFlex Trading Academy, Ramallah, Palestine | support@xflexacademy.com"
STAFF_NOTIFICATION_ARCHIVE_ENABLED = "false"
STAFF_NOTIFICATION_ARCHIVE_DRY_RUN = "true"
STAFF_NOTIFICATION_ARCHIVE_RETENTION_DAYS = "30"
STAFF_NOTIFICATION_ARCHIVE_BATCH_LIMIT = "50"
RAW_DATA_RETENTION_ENABLED = "false"
RAW_DATA_RETENTION_DRY_RUN = "true"
RAW_DATA_RETENTION_DAYS = "90"
RAW_DATA_RETENTION_BATCH_LIMIT = "50"
